<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>book_manage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        body{
            background-color: whitesmoke;
        }
        .modal-body > form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        footer{
            text-align: center;
            background-color: #2C3E50;
            color: #ECF0F1;
            height: 70px;
        }
        .container{
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            height: auto;
            margin-top: 10px;
        }
        .add{
            width: 100%;
            background-color: cornflowerblue;
            color: #ECF0F1;
            border: solid cornflowerblue;
            border-radius: 3px;
        }
        #ip_search{
            width: 100%;
        }
        .crad1{
            display: flex;
            justify-content: space-between;
        }
        form > input{
            margin-left: 200px;
            width: 600px;
            height: 30px;
        }
        .input1{
            margin-left: 252px;
        }
        .input2{
            margin-left: 263px;
        }
        .input3{
            margin-left: 212px;
        }
        .input4{
            margin-left: 256px;
        }
        .delete{
            background-color: cornflowerblue;
        }
        .btn-blue{
            background-color: cornflowerblue;
            color: aliceblue;
            border: solid cornflowerblue;
            border-radius: 3px;
        }
        .upinput1{
            width: 450px;
            margin-left: 10px;
        }
        .table{
            text-align: center;
        }
        
    </style>
</head>
<body>
    <footer><h1>Quản Lý Danh Mục Sách</h1></footer><br>
    <div class="container">
    <form onsubmit="addBook(event)">
        <label for="name">Tên sách:</label>
        <input required class="input1" type="text" name="name"><br><br>
        <label for="name">Tác giả: </label>
        <input required class="input2" type="text" name="author"><br><br>
        <label for="name">Năm xuất bản: </label>
        <input required class="input3" type="text" name="year"><br><br>
        <label for="name">Thể loại: </label>
        <input required class="input4" type="text" name="category"><br><br>
        <button class="add" type="submit" >Thêm sách</button><br>
    </form>
    <br><input type="text" id="ip_search" onclick="searchBook()" placeholder="Tìm kiếm theo tên sách..."><br>
    <br><table class="table table-bordered">
        <thead>
            <tr>
                <th scope="col">Tên sách</th>
                <th scope="col">Tác giả</th>
                <th scope="col">Năm</th>
                <th scope="col">Thể loại</th>
                <th scope="col">Hành động</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Sửa Book</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="form_edit" onsubmit="updateBook(event)">
                        <input type="text" placeholder="Tên sách" name="index" hidden>
                        <input required class="upinput1" type="text" name="name">
                        <input required class="upinput1" type="text" name="author">
                        <input required class="upinput1" type="text" name="year">
                        <input required class="upinput1" type="text" name="category">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
                        <button type="submit" class="btn btn-primary">Lưu</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>

</html>
